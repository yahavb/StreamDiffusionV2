# StreamDiffusionV2 — Neuron job. Renders cat + dog (mp4 + frames) AND runs the full
# profiler (general engine breakdown + system-trace bundle + per-NEFF DMA analysis).
# EVERYTHING for one run lives under ONE timestamped folder — never scattered at root.
#
# Output:
#   /var/mdl/stream_diffusion/runs/<YYYYMMDDHHMM>/   (America/Los_Angeles)
#       cat.mp4   cat_frames/      dog.mp4   dog_frames/
#       run.log
#       profile/perneff_breakdown.txt      (general/model-level engine breakdown)
#       profile/dma_analysis.txt           (per-NEFF instruction-level: names the op)
#       profile/hotspots_<hash>.txt        (dominant-NEFF summary-text)
#       profile/systrace_bundle.tar.gz     (Neuron Profiler 2.0, uploadable: trace_info.pb)
#
# Code branch is the BRANCH env var (default master = good-quality baseline).
# Launch:
#   kubectl delete job sd --ignore-not-found
#   kubectl apply -f sd-job.yaml
#   kubectl logs -f job/sd
apiVersion: batch/v1
kind: Job
metadata:
  name: sd
  namespace: default
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: sd
    spec:
      restartPolicy: Never
      nodeSelector:
        node-type: trn2
      resourceClaims:
        - name: s-lnc1-trn2
          resourceClaimTemplateName: s-lnc1-trn2
      containers:
        - name: sd
          image: 421672808698.dkr.ecr.us-east-1.amazonaws.com/concourse-release-0461d3b:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - "-ec"
            - |
              set -euo pipefail

              BRANCH="${BRANCH:-master}"
              cd /tmp
              git clone -b "$BRANCH" https://yahavb:${GITHUB_TOKEN}@github.com/yahavb/StreamDiffusionV2.git REPO
              cd REPO

              # ── PROVENANCE part 1: which code (no deps needed; right after clone) ──
              GIT_SHA=$(git rev-parse HEAD); GIT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
              echo "┌── PROVENANCE ──"
              echo "│ branch : $GIT_BRANCH (requested: $BRANCH)"
              echo "│ commit : $GIT_SHA"
              echo "│ subject: $(git log -1 --pretty=%s)"
              echo "└────────────────"

              export RF_DEVICE_BACKEND=neuron
              uv pip install -r requirements-neuron.txt || pip install -r requirements-neuron.txt
              uv pip install "setuptools<81" || pip install "setuptools<81"
              python3 -c "import duckdb" 2>/dev/null || pip install duckdb 2>/dev/null || true

              # ── PROVENANCE part 2: feature flags (AFTER dep install — needs torch) ──
              # Confirms WHICH variant actually ran: NKI DiT kernels, VAE NKI on/off,
              # and (env) VAE compile / NKI VAE — the flags distinguishing this config.
              PROBE='import models.wan.neuron_layers as a; print("nki="+str(a.USE_NKI_KERNELS), "self_nki="+str(a.SELF_ATTN_NKI_AVAILABLE), "rope_nki="+str(a.ROPE_NKI_AVAILABLE), "ATTN_MULT="+str(a.ATTN_SEQLEN_MULTIPLE))'
              echo "PROVENANCE FEATURE: $(python3 -c "$PROBE" 2>&1 | tr '\n' ' ')  USE_NKI_VAE=${USE_NKI_VAE:-unset} USE_VAE_COMPILE=${USE_VAE_COMPILE:-unset}"

              # ─── 1.3B base weights (student size — the distilled ckpt is loaded below) ───
              WAN13="/var/mdl/wan_models/Wan2.1-T2V-1.3B.tar"
              mkdir -p wan_models
              if [[ -f "$WAN13" ]]; then
                cp "$WAN13" /tmp/w.tar && tar xf /tmp/w.tar -C wan_models/ && rm -f /tmp/w.tar
              else
                python3 -c "from huggingface_hub import snapshot_download; snapshot_download('Wan-AI/Wan2.1-T2V-1.3B', local_dir='wan_models/Wan2.1-T2V-1.3B', local_dir_use_symlinks=False)"
                tar cf /tmp/w.tar -C wan_models Wan2.1-T2V-1.3B
                mkdir -p "$(dirname $WAN13)" && cp /tmp/w.tar "$WAN13" && rm -f /tmp/w.tar
              fi
              echo "1.3B base weights ready (distilled ckpt loaded at render time)!"

              # ─── SANITY CHECK: jerryfeng 1.3B DMD checkpoint (known-good) ───
              # Isolates pipeline vs our-undertrained-ckpt: if THIS gives good video at
              # 5-step, the pipeline is sound and our distilled noise is pure undertraining.
              JERRY13="/var/mdl/ckpts/wan_causal_dmd_v2v/model.pt"
              mkdir -p ckpts/wan_causal_dmd_v2v
              if [[ -f "$JERRY13" ]]; then
                cp "$JERRY13" ckpts/wan_causal_dmd_v2v/model.pt
              else
                python3 -c "from huggingface_hub import snapshot_download; snapshot_download('jerryfeng/StreamDiffusionV2', allow_patterns=['wan_causal_dmd_v2v/*'], local_dir='ckpts')"
                mkdir -p "$(dirname $JERRY13)" && cp ckpts/wan_causal_dmd_v2v/model.pt "$JERRY13"
              fi
              echo "jerryfeng 1.3B DMD ckpt ready ($(du -h ckpts/wan_causal_dmd_v2v/model.pt | cut -f1))"

              # ─── ONE timestamped folder for this whole run ───
              # WORK ON LOCAL DISK (/tmp) — /var/mdl is S3-backed: slow on the critical
              # path AND ffmpeg can't write mp4 trailers there (Invalid argument). Copy
              # the whole run folder to /var/mdl ONCE at the very end, off critical path.
              TS=$(TZ=America/Los_Angeles date +%Y%m%d%H%M)
              RUN_DIR="/tmp/run/$TS"
              FINAL_DIR="/var/mdl/stream_diffusion/runs/$TS"
              PROF_DIR="$RUN_DIR/profile"
              mkdir -p "$PROF_DIR"
              echo "RUN_DIR=$RUN_DIR  (final -> $FINAL_DIR)"
              exec > >(tee "$RUN_DIR/run.log") 2>&1

              export TORCH_NEURONX_NEFF_CACHE_DIR=/tmp/neff_cache
              mkdir -p /tmp/neff_cache

              # ─── stage the v2v input video from S3 (INPUT_VIDEO_SRC) to LOCAL /tmp ───
              # NEVER read the input from /var/mdl on the critical path (S3-backed, slow,
              # and torchvision/imageio seeks fail). Copy ONCE here, then render from /tmp.
              IN_VIDEO=""
              if [ -n "${INPUT_VIDEO_SRC:-}" ]; then
                if [ -f "$INPUT_VIDEO_SRC" ]; then
                  IN_VIDEO="/tmp/$(basename "$INPUT_VIDEO_SRC")"
                  cp "$INPUT_VIDEO_SRC" "$IN_VIDEO"
                  echo "Staged input video: $INPUT_VIDEO_SRC -> $IN_VIDEO ($(du -h "$IN_VIDEO" | cut -f1))"
                  # INPUT SHARPNESS CEILING: v2v cannot add detail the source lacks.
                  # Print the clip's NATIVE res EARLY (before the long compile) so we
                  # can see whether a higher render res can even help. If native res
                  # < render res, the input is upscaled and gains nothing. (One-liner,
                  # NOT a heredoc — a column-0 heredoc body breaks the YAML block scalar.)
                  python3 -c "import sys,imageio.v3 as iio,numpy as np; a=np.asarray(iio.imread(sys.argv[1],plugin='pyav')); print('INPUT_RES: native %dx%d (WxH), %d frames'%(a.shape[2],a.shape[1],a.shape[0]))" "$IN_VIDEO" || echo "INPUT_RES: probe failed (non-fatal)"
                else
                  echo "ERROR: INPUT_VIDEO_SRC set but not found: $INPUT_VIDEO_SRC"; ls -la "$(dirname "$INPUT_VIDEO_SRC")" 2>/dev/null | head; exit 1
                fi
              fi

              # 14B @ 240p — LOCKED config (1.3B quality rejected). NKI attn/rope ON.
              # NPROC = total processes (= cores used); TP_DEGREE = ranks per TP group.
              # In-pod data-parallel: num streams = NPROC / TP_DEGREE.
              #   NPROC=16 TP_DEGREE=8  -> 2 streams x TP-8 (this run, all 16 cores)
              #   NPROC=8  TP_DEGREE=8  -> 1 stream  x TP-8 (lever A single-stream)
              #   NPROC=4  TP_DEGREE=4  -> 1 stream  x TP-4 (baseline)
              # 14B shards cleanly at TP {2,4,8} (40 heads, ffn 13824). Each group renders
              # its own seed -> its own _g{id} video; aggregate fps = sum of groups.
              # DISTILLED 1.3B inference (branch exp/distilled-infer): run the SD pipeline
              # with OUR distilled checkpoint (from sd-distill-job). 1.3B config, ckpt
              # overridden to the distilled model.pt, at the TRAINED res/steps (352x640,
              # 700,0). Prompt is IN-DISTRIBUTION (in the 100-prompt distill corpus).
              NPROC="${NPROC:-4}"
              TP_DEGREE="${TP_DEGREE:-4}"
              STEPS="${STEPS:-700,500,400,200,0}"
              # SANITY CHECK: run the KNOWN-GOOD jerryfeng 1.3B DMD ckpt (not our distilled
              # one) at 5-step. Good video here = pipeline sound; noise = pipeline broken.
              CKPT="${CKPT:-ckpts/wan_causal_dmd_v2v/model.pt}"
              echo "inference ckpt: $CKPT"
              BENCH_CMD="torchrun --nproc_per_node=$NPROC streamv2v/inference_neuron.py \
                --config streamv2v/configs/wan_causal_fps_neuron.yaml \
                --generator_ckpt $CKPT \
                --steps $STEPS --tp_degree $TP_DEGREE \
                --num_frames 81 --height 352 --width 640 --device neuron"

              # ════════════════ PART A: RENDER (v2v: restyle input video) -> mp4 + frames in RUN_DIR ═══════
              # $3 (optional) = input video path -> v2v restyle. Omit -> t2v from noise.
              render() {
                local NAME="$1" PROMPT="$2" VIDEO="${3:-}"
                echo "=== rendering [$NAME]: $PROMPT  (video=${VIDEO:-none}) ==="
                local FRAMES_DIR="$RUN_DIR/${NAME}_frames"
                local VID_ARG=""
                [ -n "$VIDEO" ] && VID_ARG="--video_path $VIDEO --noise_scale 0.4"
                $BENCH_CMD --prompt "$PROMPT" --fps 16 $VID_ARG \
                  --output_path "$RUN_DIR/${NAME}.mp4" || echo "[$NAME] render FAILED"
                if ls "$FRAMES_DIR"/frame_*.png >/dev/null 2>&1; then
                  python3 -c "import imageio,glob; fr=sorted(glob.glob('$FRAMES_DIR/frame_*.png')); w=imageio.get_writer('$RUN_DIR/${NAME}.mp4', fps=16); [w.append_data(imageio.imread(f)) for f in fr]; w.close(); print('[$NAME] wrote $RUN_DIR/${NAME}.mp4 with', len(fr), 'frames')"
                else
                  echo "[$NAME] NO frames in $FRAMES_DIR — mp4 not written"
                fi
              }
              # DISTILLED-MODEL VALIDATION (task #23): render an IN-DISTRIBUTION prompt
              # (record 1 of the 100-prompt distill corpus — pancake flip). If the
              # distilled student produces a coherent on-prompt clip (vs base-1.3B cartoony),
              # the distill concept works; then the per-block fps line = the perf payoff.
              render pancake "A person in a striped shirt flips a pancake in a kitchen. The camera is handheld and shaky, capturing the motion as the person lifts and releases the pan. The background shows a dining area with another person seated. Warm indoor lighting illuminates the scene."

              # ════════════════ PART B: HIGH-LEVEL profiler ONLY (no neuron-profiler/systrace) ═══════
              # The per-block "Block N: DiT=.. VAE=.. fps" timing in the render above IS the
              # high-level hotspot signal (DiT vs VAE split). We additionally do the LIGHT
              # per-NEFF engine breakdown (capture --single-io -> profile_all_neffs aggregate),
              # but SKIP step5 DMA-parquet and step6 systrace — those stack a 2nd full inference
              # under inspect instrumentation and OOM'd a core (878MB on NC4) last run.
              echo "=== [profiler] LIGHT per-NEFF engine breakdown (no DMA/systrace) ==="
              POUT=/tmp/perneff_prof; rm -rf "$POUT"; mkdir -p "$POUT"
              mapfile -t NEFFS < <(find /tmp/neff_cache -name "*.neff" 2>/dev/null | sort)
              echo "NEFFs in cache: ${#NEFFS[@]}"
              OK=0
              for neff in "${NEFFS[@]}"; do
                hash=$(basename "$neff" .neff); ntff="$POUT/${hash}.ntff"; json="$POUT/${hash}.json"
                NEURON_RT_ENABLE_DGE_NOTIFICATIONS=1 timeout 180 \
                  neuron-profile capture --single-io -n "$neff" -s "$ntff" >/dev/null 2>&1 || continue
                [ -f "$ntff" ] || continue
                timeout 120 neuron-profile view -n "$neff" -s "$ntff" --output-format summary-json > "$json" 2>/dev/null || true
                [ -s "$json" ] && OK=$((OK+1))
              done
              echo "captured+viewed OK: $OK / ${#NEFFS[@]}"
              python3 scripts/neuron/profile_all_neffs.py "$POUT" 2>&1 | tee "$PROF_DIR/perneff_breakdown.txt" || echo "aggregation failed"

              # ═══ STEP 5: HEAVY instruction-level DMA analysis (names the copy op) ═══
              # The light pass above gives engine SHARES but not WHICH source op drives
              # the DMA. This step ingests the top-N heaviest NEFF+NTFF pairs to parquet
              # (neuron-explorer) and names the HLO op + source line via duckdb. This is
              # how we tell WHICH remaining KV-cache copy is now dominant post-#20.
              echo "=== [profiler] STEP 5: heavy DMA-parquet on top NEFFs ==="
              PAIRS=/tmp/ntff_pairs; rm -rf "$PAIRS"; mkdir -p "$PAIRS"
              # top-8 NTFFs by file size (heaviest captures) + their matching NEFFs
              for ntff in $(ls -S "$POUT"/*.ntff 2>/dev/null | head -8); do
                h=$(basename "$ntff" .ntff)
                src=$(find /tmp/neff_cache -name "${h}.neff" 2>/dev/null | head -1)
                [ -n "$src" ] && cp "$src" "$PAIRS/${h}.neff" && cp "$ntff" "$PAIRS/${h}.ntff"
              done
              echo "step5 pairs: $(ls "$PAIRS"/*.neff 2>/dev/null | wc -l)"
              bash scripts/neuron/run_dma_analysis.sh "$PAIRS" 2>&1 | tee "$PROF_DIR/dma_analysis.txt" || echo "DMA analysis failed (non-fatal)"

              # ─── copy the WHOLE local run folder to /var/mdl ONCE, off critical path ───
              echo "=== copying $RUN_DIR -> $FINAL_DIR (S3, end of job) ==="
              mkdir -p "$FINAL_DIR"
              cp -r "$RUN_DIR"/. "$FINAL_DIR"/ 2>&1 || echo "copy to /var/mdl failed"
              echo "=== DONE. contents of $FINAL_DIR ==="
              ls -lhR "$FINAL_DIR" | head -80
          resources:
            claims:
              - name: s-lnc1-trn2
            requests:
              cpu: 44
              memory: 1000Gi
            limits:
              cpu: 44
              memory: 1000Gi
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: 621547421844-ap-southeast-4-pvc
              mountPath: /var/mdl
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: BRANCH
              value: "exp/distilled-infer"
            # t2v (no input video) — distilled 1.3B validation on in-distribution prompt.
            - name: INPUT_VIDEO_SRC
              value: ""
            # 1.3B student: TP-4 (12 heads -> TP must divide 12). NPROC==TP_DEGREE=4.
            - name: NPROC
              value: "4"
            - name: TP_DEGREE
              value: "4"
            # MUST match the distilled step count (trained with 700,0).
            - name: STEPS
              value: "700,500,400,200,0"
            - name: DISTILL_CKPT
              value: "/var/mdl/video-distill/checkpoints/202607021142/model.pt"
            - name: USE_KV_PREFIX_CACHE
              value: "1"  # #20: cache per-block KV prefix, skip per-step copy (41% DMA)            - name: NEURON_RT_LOG_LEVEL
              value: "ERROR"
            - name: NEURON_CC_LOG_LEVEL
              value: "ERROR"
            - name: TORCH_NEURONX_LOG_LEVEL
              value: "ERROR"
            - name: NEURON_CC_FLAGS
              value: "--model-type=transformer"
            # LNC=1 to expose 8 logical cores per node for TP-8 (m-lnc1-trn2 grants
            # LNC1). LNC=2 fuses core pairs -> only 4 logical cores -> can't do TP-8.
            # (We're at 240p so the 480p VAE-compile env that needed LNC=2 is moot.)
            # The RDH buffer bump (128MB) stays — harmless, enlarges runtime channel buf.
            - name: NEURON_LOGICAL_NC_CONFIG
              value: "1"
            - name: NEURON_RT_DBG_INTRA_RDH_CHANNEL_BUFFER_SIZE
              value: "134217728"
            - name: TORCH_NEURONX_NEFF_CACHE_DIR
              value: "/tmp/neff_cache"
            - name: USE_NKI_KERNELS
              value: "true"
            # NKI VAE conv2d_k3 (9 full-res shifted copies -> 27-tensor aten::cat) fails
            # to compile (ConnectToService errno=2). Keep off -> plain-PyTorch VAE decode.
            - name: USE_NKI_VAE
              value: "0"
            # Step0: use the ported rolling_forcing per-frame cached VAE decoder (fixes 480p).
            - name: USE_RF_VAE
              value: "1"
            # 480p REQUIRES VAE eager: USE_VAE_COMPILE=1 reintroduced the aten::cat
            # ConnectToService crash AND gave no speedup (VAE still ~4.4s/block).
            # Tested in step1 (sd-21) — keep eager.
            - name: USE_VAE_COMPILE
              value: "0"
            - name: USE_TORCH_COMPILE
              value: "true"
            - name: NEURON_COMPILE_BACKEND
              value: "neuron"
            - name: MASTER_ADDR
              value: "127.0.0.1"
            - name: MASTER_PORT
              value: "29500"
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: HF_TOKEN
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-token
                  key: GITHUB_TOKEN
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi
        - name: 621547421844-ap-southeast-4-pvc
          persistentVolumeClaim:
            claimName: 621547421844-ap-southeast-4-pvc
