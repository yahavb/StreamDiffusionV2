# StreamDiffusionV2 — Neuron 3-run benchmark (BASELINE)
#
# Model under test (current Neuron implementation):
#   - DiT base : Wan-AI/Wan2.1-T2V-1.3B  (30 layers, dim=1536, 12 heads, ffn=8960)
#   - DiT ckpt : TencentARC/RollingForcing -> checkpoints/rolling_forcing_dmd.pt (5-step DMD)
#   - Text enc : UMT5-XXL (umt5-xxl-enc-bf16), 512 tokens, torch.compile(backend='neuron')
#   - VAE      : Wan2.1_VAE.pth (z_dim=16), bf16
#   - Runtime  : TP-4, bf16, eager + NKI kernels, 240x416, 81 frames, num_frame_per_block=3
#
# Mandatory 3-run methodology (ONE pod):
#   [1/3] build/load NEFFs (not timed)  -> built=<N>s
#   [2/3] CLEAN run, NO profiler        -> median=<N>ms  (THE real latency)
#   [3/3] profiled run + run_explorer   -> per-NEFF engine shares + dominant-NEFF metrics
#
# Launch:
#   kubectl delete job stream-diffusion-3run-bench --ignore-not-found
#   kubectl apply -f k8s/stream-diffusion-3run-bench-job.yaml
#   kubectl logs -f job/stream-diffusion-3run-bench
apiVersion: batch/v1
kind: Job
metadata:
  name: stream-diffusion-3run-bench
  namespace: default
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: stream-diffusion-3run-bench
    spec:
      restartPolicy: Never
      nodeSelector:
        node-type: trn2
      resourceClaims:
        - name: s-lnc2-trn2
          resourceClaimTemplateName: s-lnc2-trn2
      containers:
        - name: bench
          image: 421672808698.dkr.ecr.us-east-1.amazonaws.com/concourse-release-d1c940d:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - "-ec"
            - |
              set -euo pipefail

              BRANCH="${BRANCH:-master}"
              cd /tmp
              git clone -b "$BRANCH" https://yahavb:${GITHUB_TOKEN}@github.com/yahavb/StreamDiffusionV2.git REPO
              cd REPO

              # ── PROVENANCE part 1: which code (no deps needed; right after clone) ──
              GIT_SHA=$(git rev-parse HEAD); GIT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
              echo "┌── PROVENANCE ──"
              echo "│ branch : $GIT_BRANCH (requested: $BRANCH)"
              echo "│ commit : $GIT_SHA"
              echo "│ subject: $(git log -1 --pretty=%s)"
              echo "└────────────────"

              export RF_DEVICE_BACKEND=neuron
              uv pip install -r requirements-neuron.txt || pip install -r requirements-neuron.txt
              uv pip install "setuptools<81" || pip install "setuptools<81"

              # ── PROVENANCE part 2: feature flags (AFTER dep install — needs torch) ──
              PROBE='import models.wan.neuron_layers as a; print("nki="+str(a.USE_NKI_KERNELS), "self_nki="+str(a.SELF_ATTN_NKI_AVAILABLE), "rope_nki="+str(a.ROPE_NKI_AVAILABLE), "compile="+str(a.USE_TORCH_COMPILE), "ATTN_MULT="+str(a.ATTN_SEQLEN_MULTIPLE))'
              echo "PROVENANCE FEATURE: $(python3 -c "$PROBE" 2>&1 | tr '\n' ' ')"

              # ─── model weights: /var/mdl is S3-backed; single tar avoids per-file S3 overhead ───
              WAN_1_3B_TAR="/var/mdl/wan_models/Wan2.1-T2V-1.3B.tar"
              mkdir -p wan_models
              if [[ -f "$WAN_1_3B_TAR" ]]; then
                echo "Restoring Wan 1.3B tar from S3 cache..."
                cp "$WAN_1_3B_TAR" /tmp/Wan2.1-T2V-1.3B.tar
                tar xf /tmp/Wan2.1-T2V-1.3B.tar -C wan_models/ && rm -f /tmp/Wan2.1-T2V-1.3B.tar
              else
                echo "Downloading Wan-AI/Wan2.1-T2V-1.3B from HuggingFace..."
                python3 -c "from huggingface_hub import snapshot_download; snapshot_download('Wan-AI/Wan2.1-T2V-1.3B', local_dir='wan_models/Wan2.1-T2V-1.3B', local_dir_use_symlinks=False)"
                tar cf /tmp/Wan2.1-T2V-1.3B.tar -C wan_models Wan2.1-T2V-1.3B
                mkdir -p "$(dirname $WAN_1_3B_TAR)" && cp /tmp/Wan2.1-T2V-1.3B.tar "$WAN_1_3B_TAR" && rm -f /tmp/Wan2.1-T2V-1.3B.tar
              fi

              RF_CKPT_CACHE="/var/mdl/checkpoints/rolling_forcing_dmd.pt"
              mkdir -p checkpoints
              if [[ -f "$RF_CKPT_CACHE" ]]; then
                echo "Restoring RollingForcing DMD checkpoint from S3 cache..."
                cp "$RF_CKPT_CACHE" checkpoints/rolling_forcing_dmd.pt
              else
                echo "Downloading TencentARC/RollingForcing DMD checkpoint..."
                python3 -c "from huggingface_hub import hf_hub_download; hf_hub_download('TencentARC/RollingForcing', 'checkpoints/rolling_forcing_dmd.pt', local_dir='.')"
                mkdir -p "$(dirname $RF_CKPT_CACHE)" && cp checkpoints/rolling_forcing_dmd.pt "$RF_CKPT_CACHE"
              fi
              echo "Model weights ready!"

              LOCAL_RESULTS="/tmp/results"; mkdir -p "$LOCAL_RESULTS"

              # BENCH_CMD: TP-4 entrypoint. WITHOUT --warmup/--iters — the harness appends them.
              # inference_neuron.py emits built=…s (warmup 1) and median=…ms throughput=… (rank 0).
              BENCH_CMD="torchrun --nproc_per_node=4 streamv2v/inference_neuron.py \
                --config streamv2v/configs/wan_causal_dmd_v2v_neuron.yaml \
                --benchmark --num_frames 81 --height 240 --width 416 --device neuron"

              # ─── dominant-NEFF detail via neuron-profile view summary-text ($1=neff $2=ntff) ───
              # NO explorer server / DuckDB / curl (hang on big DMA NEFFs) and NO
              # --output-format json (returns EMPTY — not a valid format on-image).
              neff_hotspots() {
                local NEFF="$1" NTFF="$2" HOTS="$3"
                [ -n "$NEFF" ] && [ -f "$NTFF" ] || { echo "no NEFF/NTFF — skip detail"; return; }
                echo "═══ dominant NEFF detail (summary-text) ═══" | tee "$HOTS"
                timeout 180 neuron-profile view -n "$NEFF" -s "$NTFF" \
                  --output-format summary-text 2>/dev/null | tee -a "$HOTS" || echo "  view failed"
                echo "  (name the hot op from: gpsimd_engine_active_time_percent,"
                echo "   software_dynamic_dma_packet_percent + _count, hardware_dynamic_dma_packet_percent,"
                echo "   dma_transfer_average_bytes, matmul_instruction_count, transpose_flops)"
              }

              # ─── run_explorer: PROVEN method. neuron-profile CLI ONLY. ───
              # For EACH cached NEFF: capture --single-io -> view summary-json -> aggregate.
              # Then summary-text on the dominant NEFF. NO neuron-explorer server / SQL / parquet.
              run_explorer() {
                local POUT=/tmp/perneff_prof; rm -rf "$POUT"; mkdir -p "$POUT"
                mapfile -t NEFFS < <(find /tmp/neff_cache -name "*.neff" 2>/dev/null | sort)
                echo "NEFFs in cache: ${#NEFFS[@]}"
                local OK=0
                for neff in "${NEFFS[@]}"; do
                  local hash; hash=$(basename "$neff" .neff)
                  local ntff="$POUT/${hash}.ntff" json="$POUT/${hash}.json"
                  NEURON_RT_ENABLE_DGE_NOTIFICATIONS=1 timeout 180 \
                    neuron-profile capture --single-io -n "$neff" -s "$ntff" >/dev/null 2>&1 || continue
                  [ -f "$ntff" ] || continue
                  timeout 120 neuron-profile view -n "$neff" -s "$ntff" --output-format summary-json > "$json" 2>/dev/null || true
                  [ -s "$json" ] && OK=$((OK+1))
                done
                echo "captured+viewed OK: $OK / ${#NEFFS[@]}"
                python3 scripts/neuron/profile_all_neffs.py "$POUT" 2>&1 | tee "$LOCAL_RESULTS/perneff_breakdown.txt" || echo "aggregation failed"
                local BIGHASH BIGNEFF
                BIGHASH=$(python3 scripts/neuron/pick_neffs.py "$POUT" /tmp/neff_cache | head -1)
                BIGNEFF=$(find /tmp/neff_cache -name "${BIGHASH}.neff" 2>/dev/null | head -1)
                neff_hotspots "$BIGNEFF" "$POUT/${BIGHASH}.ntff" "$LOCAL_RESULTS/hotspots_${BIGHASH}.txt"
              }

              echo "════════════ NEURON 3-RUN BENCHMARK (StreamDiffusionV2 baseline) ════════════"
              echo "  model    : Wan2.1-T2V-1.3B + RollingForcing-DMD, TP-4, bf16, 240x416x81"
              echo "  reference: rolling-forcing trn2 (same Wan2.1-1.3B DMD) — see TRAINIUM_PORT_SUMMARY.md"
              echo "============================================================================="

              echo "=== [1/3] WARMUP (compile-if-cold / load NEFFs; not timed) ==="
              $BENCH_CMD --warmup 1 --iters 0 \
                2>&1 | tee "$LOCAL_RESULTS/warmup.txt" | grep -iE "built=|warmup|FAILED|PROVENANCE" || echo "WARMUP FAILED"

              echo "=== [2/3] CLEAN RUN (NO profiler) — median of 5 = REAL LATENCY ==="
              env -u NEURON_RT_INSPECT_ENABLE -u NEURON_RT_INSPECT_OUTPUT_DIR -u NEURON_RT_INSPECT_DEVICE_PROFILE \
                $BENCH_CMD --warmup 1 --iters 5 \
                2>&1 | tee "$LOCAL_RESULTS/clean.txt" | grep -iE "built=|median|throughput|FAILED" || echo "CLEAN RUN FAILED"
              T_CLEAN=$(grep -oE "median=[0-9.]+ms" "$LOCAL_RESULTS/clean.txt" | head -1)

              echo "=== [3/3] PROFILED RUN (NEURON_RT_INSPECT_ENABLE=1, system only — overhead delta) ==="
              NEURON_RT_INSPECT_ENABLE=1 $BENCH_CMD --warmup 1 --iters 5 \
                2>&1 | tee "$LOCAL_RESULTS/profiled.txt" | grep -iE "built=|median|throughput|FAILED" || echo "PROFILED RUN FAILED"
              T_PROF=$(grep -oE "median=[0-9.]+ms" "$LOCAL_RESULTS/profiled.txt" | head -1)

              echo "=== [4] per-NEFF engine breakdown + dominant-NEFF metrics (neuron-profile CLI) ==="
              run_explorer

              echo "=== PROFILER-OVERHEAD COMPARISON ==="
              echo "  clean    (no profiler, REAL latency) : ${T_CLEAN:-N/A}"
              echo "  profiled (profiler on)               : ${T_PROF:-N/A}"
              echo "  (compare engine SHARES from run 3, not absolute µs)"

              # ─── persist results (single tar.gz to the PVC; never many files) ───
              ARCHIVE="/tmp/stream-diffusion-3run-bench_results.tar.gz"
              tar -czf "$ARCHIVE" -C "$(dirname "$LOCAL_RESULTS")" "$(basename "$LOCAL_RESULTS")" 2>/dev/null || true
              cp "$ARCHIVE" "/var/mdl/" 2>/dev/null && echo "Saved: /var/mdl/$(basename "$ARCHIVE")" || echo "persist skipped"
          resources:
            claims:
              - name: s-lnc2-trn2
            requests:
              cpu: 22
              memory: 220Gi
            limits:
              cpu: 22
              memory: 220Gi
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: 621547421844-ap-southeast-4-pvc
              mountPath: /var/mdl
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: BRANCH
              value: "master"
            - name: NEURON_RT_LOG_LEVEL
              value: "ERROR"
            - name: NEURON_CC_LOG_LEVEL
              value: "ERROR"
            - name: TORCH_NEURONX_LOG_LEVEL
              value: "ERROR"
            - name: RF_DEVICE_BACKEND
              value: "neuron"
            - name: NEURON_CC_FLAGS
              value: "--model-type=transformer"
            # NEFF cache dir — restored/compiled here, then enumerated by run_explorer.
            - name: TORCH_NEURONX_NEFF_CACHE_DIR
              value: "/tmp/neff_cache"
            - name: USE_NKI_KERNELS
              value: "true"
            - name: USE_TORCH_COMPILE
              value: "true"
            - name: NEURON_COMPILE_BACKEND
              value: "neuron"
            - name: MASTER_ADDR
              value: "127.0.0.1"
            - name: MASTER_PORT
              value: "29500"
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: HF_TOKEN
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-token
                  key: GITHUB_TOKEN
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi
        - name: 621547421844-ap-southeast-4-pvc
          persistentVolumeClaim:
            claimName: 621547421844-ap-southeast-4-pvc
