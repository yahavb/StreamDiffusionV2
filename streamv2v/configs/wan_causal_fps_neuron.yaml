# StreamDiffusionV2 — FPS-optimized Neuron config (1.3B, 480p).
# Goal: MAX fps that still looks good. Non-parallel levers only:
#   - 1.3B model (14B is fps-hopeless)
#   - few denoising steps (the step list below is OVERRIDDEN per-run by the
#     job's STEPS sweep so we can read fps-vs-quality; default here = 3)
#   - short KV-cache window (num_kv_cache) + small block
# Resolution stays 480x832 (paper res, not "stupid small"). Quality is
# validated every run — fastest step count that watches clean wins.
model_name: wan
generator_name: neuron_causal_wan
model_type: T2V-1.3B
model_path: wan_models/Wan2.1-T2V-1.3B
vae_path: wan_models/Wan2.1-T2V-1.3B/Wan2.1_VAE.pth
generator_ckpt: ckpts/wan_causal_dmd_v2v/model.pt
use_ema: false

# 5-step = the ONLY step count confirmed to look good on these (non-1-step-distilled)
# weights. This is the quality floor; --steps can override for a fps-vs-quality sweep.
denoising_step_list:
- 700
- 500
- 400
- 200
- 0

num_train_timestep: 1000
timestep_shift: 8.0
warp_denoising_step: false
t2v: true

height: 480
width: 832
num_frames: 81

num_frame_per_block: 3
num_kv_cache: 6
num_sink_tokens: 3
adapt_sink_threshold: 0.2

tp_degree: 4
seed: 0

image_or_video_shape:
- 1
- 81
- 16
- 60
- 104

negative_prompt: '色调艳丽，过曝，静态，细节模糊不清，字幕，风格，作品，画作，画面，静止，整体发灰，最差质量，低质量，JPEG压缩残留，丑陋的，残缺的，多余的手指，画得不好的手部，画得不好的脸部，畸形的，毁容的，形态畸形的肢体，手指融合，静止不动的画面，杂乱的背景，三条腿，背景人很多，倒着走'
