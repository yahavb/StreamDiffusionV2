# StreamDiffusionV2 config for Neuron/Trainium inference
# Wan2.1-T2V-1.3B causal DMD on Trainium (trn2)
#
# Usage:
#   python streamv2v/inference_neuron.py \
#     --config streamv2v/configs/wan_causal_dmd_v2v_neuron.yaml \
#     --benchmark

model_name: wan
generator_name: neuron_causal_wan
model_type: T2V-1.3B
model_path: wan_models/Wan2.1-T2V-1.3B
vae_path: wan_models/Wan2.1-T2V-1.3B/Wan2.1_VAE.pth
generator_ckpt: checkpoints/ode_init.pt
use_ema: false

denoising_step_list:
- 1000
- 950
- 900
- 850
- 800
- 750
- 700
- 650
- 600
- 550
- 500
- 450
- 400
- 350
- 300
- 250
- 200
- 150
- 100
- 50

num_train_timestep: 1000
timestep_shift: 5.0
warp_denoising_step: true
t2v: true

height: 240
width: 416
num_frames: 81

num_frame_per_block: 3
num_kv_cache: 6
num_sink_tokens: 3
adapt_sink_threshold: 0.2

tp_degree: 4
seed: 0

image_or_video_shape:
- 1
- 81
- 16
- 30
- 52

negative_prompt: '色调艳丽，过曝，静态，细节模糊不清，字幕，风格，作品，画作，画面，静止，整体发灰，最差质量，低质量，JPEG压缩残留，丑陋的，残缺的，多余的手指，画得不好的手部，画得不好的脸部，畸形的，毁容的，形态畸形的肢体，手指融合，静止不动的画面，杂乱的背景，三条腿，背景人很多，倒着走'
